name: Update and publish

on:
  schedule:
    - cron: "17 6 * * *"   # every morning at about 7am UK time
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]        # republish whenever you upload changed files

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest results, fixtures and odds, then rebuild
        run: python update.py

      - name: Save the new data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results_*.json fixtures_*.json odds.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update results and fixtures"
            git push
          fi

      - name: Collect the website files
        run: |
          mkdir _site
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
